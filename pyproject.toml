[project]
name = "pdf-embolden"
version = "1.0.0"
description = "Make thin print fonts in a PDF look heavier on screen, without moving a single glyph."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["pikepdf>=8"]

[dependency-groups]
dev = ["pytest>=7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
